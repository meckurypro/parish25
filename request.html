<!-- /parish25/request.html — request-a-visit form for parishes -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Visit — Parish 25 Initiative</title>
<meta name="description" content="Request an AI literacy workshop visit for your parish through the Parish 25 Initiative.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top-nav">
  <a class="wordmark" href="index.html">Parish 25<span>.</span></a>
  <nav><a href="index.html">See progress</a></nav>
</div>

<main class="wrap">

  <section class="hero">
    <p class="eyebrow">Request a visit</p>
    <h1 class="hero-title">Bring the workshop to <em>your parish.</em></h1>
    <p class="hero-lede">
      Tell us about your parish and the best way to reach you. A member of the team
      will follow up to arrange a visit.
    </p>
  </section>

  <div class="card">
    <!--
      FORM SUBMISSION — currently unwired.
      Plan (per conversation): Supabase table `parish_enquiries` + admin page,
      matching the pattern used for IQ Ads. Fields below map directly to that
      table's columns. Until the backend is connected, this form has no action
      and will not submit anywhere.
    -->
    <form id="visit-request-form">
      <div class="field">
        <label for="parish_name">Parish name</label>
        <input type="text" id="parish_name" name="parish_name" required autocomplete="organization">
      </div>

      <div class="field">
        <label for="location">Parish location / area</label>
        <input type="text" id="location" name="location" required autocomplete="address-level2">
      </div>

      <div class="field">
        <label for="contact_name">Contact person</label>
        <input type="text" id="contact_name" name="contact_name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel">
      </div>

      <div class="field">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="message">Anything else we should know?</label>
        <textarea id="message" name="message"></textarea>
      </div>

      <button type="submit" class="btn">Send request</button>
    </form>
  </div>

  <footer>
    <span>Parish 25 Initiative — a PromptIQ movement</span>
    <a href="index.html">Back to progress →</a>
  </footer>

</main>
</body>
</html>
